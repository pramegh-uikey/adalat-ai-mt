[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adalat-mt"
version = "0.1.0"
description = "English→Hindi legal translation: tokenizer efficiency study and LoRA adaptation of IndicTrans2"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: needs model downloads (deselect with -m 'not slow')"]
