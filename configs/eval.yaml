# Evaluation aggregation for `python -m adalat_mt.evaluation.evaluate` (Phase 3).
split: test
pred_dir: results/predictions
comet_dir: results/comet
baseline: it2-1b
systems: [it2-1b, it2-200m, nllb-600m, it2-1b-lora, it2-200m-lora]     # labels come from configs/systems.yaml
comparisons: [[it2-1b, it2-1b-lora], [it2-200m, it2-200m-lora], [it2-1b, it2-200m], [it2-1b, nllb-600m], [it2-1b-lora, it2-200m-lora]]
bootstrap: {n_samples: 1000, seed: 13, metrics: [bleu, spbleu, chrf]}
