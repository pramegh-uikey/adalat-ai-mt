# LoRA adaptation of IndicTrans2-1B on the legal train split (DECISIONS.md D1, D7).
base_model: ai4bharat/indictrans2-en-indic-1B
src_lang: eng_Latn
tgt_lang: hin_Deva
data_dir: data/processed
out_dir: outputs/lora_it2_1b        # relative to the working dir (/content/work on Colab)
seed: 13
max_length: 256
lora:
  r: 16
  alpha: 32
  dropout: 0.1
  target_modules: [q_proj, k_proj, v_proj, out_proj, fc1, fc2]   # encoder + decoder attention and FFN
train:
  epochs: 6
  lr: 3.0e-4
  batch_size: 4
  grad_accum: 4                     # effective batch 16 (reduced from 8x2 after CUDA OOM on T4 16GB)
  warmup_ratio: 0.06
  weight_decay: 0.01
  label_smoothing: 0.1
  max_grad_norm: 1.0
  fp16: true                        # T4 has no bf16
  log_every: 20
eval:
  num_beams: 4
  batch_size: 32
  patience: 2                       # epochs without dev chrF++ improvement before stopping
