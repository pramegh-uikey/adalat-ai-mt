# Legal EN→HI glossary used for terminology-accuracy analysis (NOT for training).
# en: regex (case-insensitive, word-bounded by the matcher); hi: accepted Hindi renderings (stems; matched as substrings
# after nukta/chandrabindu normalisation). category: the qualitative category the term exercises.
# Variants were drafted from standard Hindi legal usage (e.g. the Legislative Department's glossary conventions) and
# refined against what the TRAIN-split references actually use (never the test split).
