tokenizers:
  - {name: cl100k_base, kind: tiktoken, ident: cl100k_base, family: "GPT-4 / GPT-3.5 (OpenAI)", price: gpt-4o}
  - {name: o200k_base, kind: tiktoken, ident: o200k_base, family: "GPT-4o (OpenAI)", price: gpt-4o}
  - {name: llama-3.2, kind: hf, ident: unsloth/Llama-3.2-1B, family: "Llama-3 (ungated mirror, identical tokenizer)", price: gpt-4o}
  - {name: gemma-3, kind: hf, ident: unsloth/gemma-3-1b-it, family: "Gemma-3", price: gpt-4o}
  - {name: qwen2.5, kind: hf, ident: Qwen/Qwen2.5-1.5B-Instruct, family: "Qwen2.5", price: gpt-4o}
  - {name: tinyllama(llama-2), kind: hf, ident: TinyLlama/TinyLlama-1.1B-Chat-v1.0, family: "Llama-2 SPM (32k)", price: gpt-4o}
  - {name: sarvam-1, kind: hf, ident: sarvamai/sarvam-1, family: "Sarvam-1 (Indic LLM)", price: gpt-4o}
  - {name: muril, kind: hf, ident: google/muril-base-cased, family: "MuRIL WordPiece", price: gpt-4o}
  - {name: indicbert-v2, kind: hf, ident: ai4bharat/IndicBERTv2-MLM-only, family: "IndicBERT v2", price: gpt-4o}
  - {name: indictrans2, kind: spm_pair, ident: ai4bharat/indictrans2-en-indic-1B, src_file: model.SRC, tgt_file: model.TGT,
     family: "IndicTrans2 (separate EN/Indic SPM)", model_max_len: 256, price: gpt-4o}
  - {name: nllb-200, kind: hf, ident: facebook/nllb-200-distilled-600M, family: "NLLB-200 SPM", model_max_len: 512, price: gpt-4o}
  - {name: mbart-50, kind: hf, ident: facebook/mbart-large-50-many-to-many-mmt, family: "mBART-50 SPM", model_max_len: 1024, price: gpt-4o}
length_limits: [128, 256, 512]
# Every tokenizer is priced at the SAME per-token rate so the cost column isolates the tokenizer effect (what a
# judgment would cost if a model with that tokenizer were served at gpt-4o's list price).
# Illustrative list prices (USD per 1M tokens) — ASSUMPTIONS for relative cost, not verified live prices.
prices:
  gpt-4o: {input: 2.50, output: 10.00, source: "OpenAI pricing page (2024 list price), assumption"}
  gpt-4o-mini: {input: 0.15, output: 0.60, source: "OpenAI pricing page (2024 list price), assumption"}
