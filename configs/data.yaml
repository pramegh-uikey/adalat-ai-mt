# Phase 1 data pipeline configuration. See src/adalat_mt/data/build.py.
dataset_dir: dataset
interim_dir: data/interim
processed_dir: data/processed
results_dir: results/data
audit_dir: data/audit
split_config: configs/split.yaml

labse_model: sentence-transformers/LaBSE
labse_cache_dir: .cache/labse

audit_sample_size: 20
audit_seed: 13

align:
  max_block: 3
  skip_threshold: 0.40
  merge_penalty: 0.05
  anchor_bonus: 0.05
  min_score: 0.60
  len_ratio: [0.5, 2.5]

# Hindi "clean" files 6, 14, 22, 25, 26 contain no Devanagari (every glyph is '?'). Their text is recovered from the
# PDFs by `python -m adalat_mt.data.pdf_recover` (Tesseract `hin` OCR for words + PDF text-layer digits for numbers)
# and read from `dir` instead (DECISIONS.md D9). They are placed in the train split only.
recovered_hindi:
  dir: data/recovered/hindi
  ids: [6, 14, 22, 25, 26]
  note: "the provided Hindi clean text is entirely '?'; recovered text is OCR output (train split only)."
